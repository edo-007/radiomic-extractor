# Configurazione del progetto.
#
# Sintassi YAML:
# - I percorsi vanno scritti tra virgolette, soprattutto su Windows.
# - I percorsi relativi, come "./results", sono calcolati partendo dalla cartella
#   in cui si trova questo file config_extractor.yaml.
# - I numeri decimali usano il punto, non la virgola: 32.0, non 32,0.
# - Le liste brevi possono essere scritte tra parentesi quadre: [1.0, 1.0, 1.0].
# - Usa null quando un parametro e' opzionale e non vuoi impostarlo.
# - Usa .nan per indicare un limite numerico aperto.


# =============================================================================
# DATASET E OUTPUT
# =============================================================================
data:
  # Cartella radice che contiene gli studi dei pazienti.
  #
  # Esempi:
  # - Windows: "C:/Users/TA/Desktop/edoardo/radiomic-data/Radiomica"
  # - Linux: "/home/edoardo/Desktop/legnago/python-scripts/radiomic-data/Radiomica"
  patients_folder: "/home/edoardo/Desktop/legnago/python-scripts/radiomic-data/"

  # CSV con DicomID, NomeCognome e stato microsatellitare.
  patients_csv: "../radiomic-data/pazienti.csv"

  # Cartella dove salvare feature, preview e risultati prodotti.
  output_dir: "./results"


# =============================================================================
# METADATI DICOM DA AGGIUNGERE AL CSV
# =============================================================================
dicom_metadata:
  # Usa enabled: false per non aggiungere metadati DICOM al CSV finale.
  enabled: true

  # Ogni colonna finale inizia con metadata_.
  # Esempio: StudyDate diventa metadata_study_date.
  tags:
    # Data dello studio CT nel formato DICOM YYYYMMDD.
    - StudyDate

    # Produttore dello scanner.
    - Manufacturer

    # Modello dello scanner.
    - ManufacturerModelName

    # Spessore della slice CT in millimetri.
    - SliceThickness

    # Kernel/algoritmo di ricostruzione CT.
    - ConvolutionKernel

    # Tensione del tubo radiogeno in kVp.
    - KVP

    # Corrente del tubo radiogeno; equivalente numerico: "(0018,1151)".
    - XRayTubeCurrent

    # Per leggere un tag dal RTStruct invece che dalla CT:
    # - tag: StructureSetLabel
    #   source: rt


# =============================================================================
# MIRP - ESTRAZIONE RADIOMICA
# =============================================================================
mirp:
  # ---------------------------------------------------------------------------
  # Preprocessing e ROI
  # ---------------------------------------------------------------------------
  # Ampiezza del bin per la discretizzazione fixed_bin_size delle immagini base.
  # bin_width: 32.0
  bin_width: 64.0

  # Tre valori [z, y, x] per il ricampionamento.
  # voxel_spacing: [1.0, 1.0, 1.0]
  voxel_spacing: [5.0, 5.0, 5.0]

  # Lista delle ROI da cui estrarre. Esempio: ["GTV"].
  roi_names: ["GTV"]

  # Due valori [min, max] per filtrare le HU.
  # .nan come limite superiore indica nessun massimo.
  resegmentation_intensity_range: [-1000.0, .nan]

  # ---------------------------------------------------------------------------
  # Feature base estratte dalla CT originale
  # ---------------------------------------------------------------------------
  feature_families:
    - statistics
    - intensity_histogram
    - morph
    - intensity_volume_histogram
    - glcm  # grey_level_cooccurrence_matrix
    - glrlm # grey_level_run_length_matrix
    - glszm # grey_level_size_zone_matrix
    - gldzm # grey_level_distance_zone_matrix
    - ngtdm # neighbourhood_grey_tone_difference_matrix
    - ngldm # neighbouring_grey_level_dependence_matrix

  # ---------------------------------------------------------------------------
  # Filtri immagine IBSI-compliant
  # ---------------------------------------------------------------------------
  # ibsi_compliant e' sempre true nel codice e non va configurato qui.
  #
  # Valori ammessi:
  # - mean
  # - laplacian_of_gaussian
  # - log
  # - laws
  # - gabor
  # - separable_wavelet
  # - nonseparable_wavelet
  #
  # Usa null per mantenere invariata l'estrazione di base.
  # filter_kernels: null
  filter_kernels:
    # - laplacian_of_gaussian
    - gabor
    # - laws
    # - separable_wavelet
    # - nonseparable_wavelet

  # ---------------------------------------------------------------------------
  # Feature estratte dalle immagini filtrate
  # ---------------------------------------------------------------------------
  response_map_feature_families:
    - statistics
    - intensity_histogram
    - glcm  # grey_level_cooccurrence_matrix
    - glrlm # grey_level_run_length_matrix
    - glszm # grey_level_size_zone_matrix
    - gldzm # grey_level_distance_zone_matrix
    - ngtdm # neighbourhood_grey_tone_difference_matrix
    - ngldm # neighbouring_grey_level_dependence_matrix

  # MIRP sconsiglia fixed_bin_size sulle response map perche' dopo il filtraggio 
  # l'intensita' non mantiene un'unita' fisica diretta.
  response_map_discretisation_n_bins: 16

  # Gestione dei bordi durante i filtri.
  boundary_condition: mirror

  # ---------------------------------------------------------------------------
  # Mean filter
  # ---------------------------------------------------------------------------
  # Richiesto solo se filter_kernels contiene mean.
  mean_filter_kernel_size: null

  # ---------------------------------------------------------------------------
  # Laplacian-of-Gaussian filter
  # ---------------------------------------------------------------------------
  # Usa questo filtro per i Laplace filters IBSI-compliant.
  # Il filtro laplace/laplacian semplice non e' IBSI-compliant e non e' esposto.
  #
  # Richiesto solo se filter_kernels contiene laplacian_of_gaussian o log.
  laplacian_of_gaussian_sigma: [5.0, 10.0]
  laplacian_of_gaussian_kernel_truncate: 4.0
  laplacian_of_gaussian_pooling_method: none

  # ---------------------------------------------------------------------------
  # Gabor filter
  # ---------------------------------------------------------------------------
  # Richiesti solo se filter_kernels contiene gabor:
  # - gabor_sigma
  # - gabor_lambda
  gabor_sigma: [2.0, 4.0]
  gabor_lambda: [1.0, 2.0]
  gabor_gamma: 1.0
  gabor_theta: 0.0 # alternativa: [0.0, 45.0, 90.0, 135.0]
  gabor_theta_step: null
  gabor_response: modulus
  gabor_rotation_invariance: false
  gabor_pooling_method: max

  # ---------------------------------------------------------------------------
  # Laws filter
  # ---------------------------------------------------------------------------
  # Richiesto solo se filter_kernels contiene laws.
  laws_kernel: [l5e5s5, w5r5l3]
  laws_delta: 7
  laws_compute_energy: true
  laws_rotation_invariance: true
  laws_pooling_method: max

  # ---------------------------------------------------------------------------
  # Wavelet separabili
  # ---------------------------------------------------------------------------
  # Richiesti solo se filter_kernels contiene separable_wavelet:
  # - separable_wavelet_families
  # - separable_wavelet_set
  separable_wavelet_families: [coif4]
  separable_wavelet_set: [hhh, lll]
  separable_wavelet_stationary: true
  separable_wavelet_decomposition_level: 1
  separable_wavelet_rotation_invariance: true
  separable_wavelet_pooling_method: max

  # ---------------------------------------------------------------------------
  # Wavelet non separabili
  # ---------------------------------------------------------------------------
  # Richiesto solo se filter_kernels contiene nonseparable_wavelet.
  # Esempio: nonseparable_wavelet_families: [simoncelli]
  nonseparable_wavelet_families: null
  nonseparable_wavelet_decomposition_level: 1
  nonseparable_wavelet_response: real

  # ---------------------------------------------------------------------------
  # Esecuzione
  # ---------------------------------------------------------------------------
  # false per feature 3D, true per feature 2D slice-by-slice.
  by_slice: false

  # Processi paralleli; 1/null per sequenziale, -1 per tutti i core.
  # La versione attiva di extract_batch e' sequenziale.
  num_processes: 1

  # true per scrivere le feature MIRP su file.
  write_features: false

  # true per restituire le feature in Python e scrivere il CSV aggregato.
  export_features: true
